# Copy into your app's repo as .github/workflows/deploy.yml
# Repo secrets needed: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKYARD_HOOK_URL, DOCKYARD_HOOK_SECRET
# (the dashboard's "Deploy hook" tab shows the URL and secret, and a pre-filled copy of this file)
name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: yourname/your-app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Tell Dockyard to deploy
        env:
          HOOK_URL: ${{ secrets.DOCKYARD_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DOCKYARD_HOOK_SECRET }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          BODY=$(jq -nc --arg image "$IMAGE" --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" \
            '{image: $image, digest: $digest, commit: $commit}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | sed 's/^.* //')
          curl -fsS -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Dockyard-Timestamp: $TS" \
            -H "X-Dockyard-Signature: sha256=$SIG" \
            -d "$BODY"
