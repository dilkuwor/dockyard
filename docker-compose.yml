name: dockyard

services:
  # Routes every request to the right container by the first part of its hostname.
  # Public access is optional: when it is set up from the dashboard, Dockyard itself runs
  # a Cloudflare tunnel connector next to this proxy.
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dockyard_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedheaders.insecure=true
      # Custom hostnames: Dockyard writes one router file per app here.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --accesslog=true
      - --log.level=INFO
    volumes:
      - dockyard-dynamic:/dynamic:ro
    ports:
      # Local addresses: http://dockyard.localhost:8080 and http://<app>.localhost:8080.
      - "${LOCAL_BIND:-127.0.0.1}:${LOCAL_PORT:-8080}:80"
    networks: [edge, socket]
    restart: unless-stopped
    depends_on: [socket-proxy]

  # Gives Traefik read-only access to container metadata instead of the raw socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    restart: unless-stopped

  # The control plane: API, dashboard and deploy hooks.
  dockyard:
    # The published image. `docker compose up -d` pulls it; `--build` builds from this checkout instead.
    image: ${DOCKYARD_IMAGE:-ghcr.io/dilkuwor/dockyard:latest}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      EDGE_NETWORK: dockyard_edge
      LOCAL_PORT: ${LOCAL_PORT:-8080}
      DASHBOARD_SUBDOMAIN: ${DASHBOARD_SUBDOMAIN:-dockyard}
    volumes:
      # Full Docker access is required to run deployments. Treat the dashboard password like root.
      - /var/run/docker.sock:/var/run/docker.sock
      - dockyard-data:/data
      - dockyard-dynamic:/dynamic
      # Backups land here. Point BACKUP_DIR at a disk you can copy off the machine.
      - ${BACKUP_DIR:-./.data/backups}:/backups
    ports:
      # Direct local access to the dashboard, bypassing the proxy.
      - "127.0.0.1:3000:3000"
    networks: [edge]
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      # dockyard.<anything>: the local address and, with public access on, your own domain.
      traefik.http.routers.dockyard.rule: HostRegexp(`^${DASHBOARD_SUBDOMAIN:-dockyard}\.`)
      traefik.http.routers.dockyard.entrypoints: web
      traefik.http.services.dockyard.loadbalancer.server.port: "3000"

networks:
  edge:
    name: dockyard_edge
  socket:
    internal: true

volumes:
  dockyard-data:
  dockyard-dynamic:
